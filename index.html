<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Blocks">
<meta name="theme-color" content="#0d0824">
<title>Neon Blocks</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0824;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #safe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .hbtn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:5;padding:0}
  .hbtn:active{transform:scale(.9)}
  #restartBtn{right:14px}
  #soundBtn{right:64px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(8,4,24,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .35s}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{text-align:center;color:#fff;padding:32px 28px;transform:scale(.9);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  #overlay.show .card{transform:scale(1)}
  .logo{font-size:58px;font-weight:900;line-height:.95;letter-spacing:2px;
    background:linear-gradient(90deg,#ff3d81,#ffb020,#22e39b,#2fb6ff,#9b5cff,#ff3d81);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 4s linear infinite;
    filter:drop-shadow(0 0 18px rgba(155,92,255,.6))}
  @keyframes hue{to{background-position:300% 0}}
  .sub{margin:18px 0 6px;font-size:16px;opacity:.75;line-height:1.45}
  #ovScore{font-size:20px;margin:10px 0 4px;min-height:10px}
  #ovScore b{display:block;font-size:64px;font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(47,182,255,.8)}
  .rec{color:#ffd23f;font-weight:800;font-size:22px;animation:pulse .8s ease-in-out infinite alternate;text-shadow:0 0 16px #ffb020}
  @keyframes pulse{to{transform:scale(1.12)}}
  #playBtn{margin-top:22px;font:inherit;font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;border:0;border-radius:20px;
    padding:18px 54px;background:linear-gradient(135deg,#ff3d81,#9b5cff 55%,#2fb6ff);touch-action:manipulation;cursor:pointer;
    box-shadow:0 0 30px rgba(155,92,255,.7),inset 0 2px 0 rgba(255,255,255,.35);animation:glow 1.6s ease-in-out infinite alternate}
  #playBtn:active{transform:scale(.94)}
  @keyframes glow{to{box-shadow:0 0 50px rgba(255,61,129,.8),inset 0 2px 0 rgba(255,255,255,.35)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<button class="hbtn" id="soundBtn" aria-label="Звук">🔊</button>
<button class="hbtn" id="restartBtn" aria-label="Заново">↻</button>
<div id="overlay" class="show">
  <div class="card">
    <div class="logo">NEON<br>BLOCKS</div>
    <div class="sub" id="ovText">Перетаскивай фигуры на поле.<br>Собирай линии — взрывай блоки!<br>Комбо подряд = x множитель 🔥</div>
    <div id="ovScore"></div>
    <button id="playBtn">ИГРАТЬ</button>
  </div>
</div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 8;
const PALETTE = ['#ff3d81', '#ffb020', '#22e39b', '#2fb6ff', '#9b5cff', '#ff6a3d', '#f2e33a', '#18e0e0'];
const GRAY = PALETTE.length; // sprite index for gray
const rand = n => (Math.random() * n) | 0;

// ---------- color helpers ----------
function hex2rgb(h) { h = h.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function shade(h, a) { const [r, g, b] = hex2rgb(h); const f = v => Math.round(a > 0 ? v + (255 - v) * a : v * (1 + a)); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);

// ---------- shapes ----------
function norm(cells) {
  const mr = Math.min(...cells.map(a => a[0])), mc = Math.min(...cells.map(a => a[1]));
  cells = cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return { cells, w: Math.max(...cells.map(a => a[1])) + 1, h: Math.max(...cells.map(a => a[0])) + 1, key: cells.join(';') };
}
function parse(rows) { const cells = []; rows.forEach((s, r) => [...s].forEach((ch, c) => { if (ch === '#') cells.push([r, c]); })); return norm(cells); }
function rotate(s) { return norm(s.cells.map(([r, c]) => [c, -r])); }
const BASES = [
  [['#'], 1.2], [['##'], 2], [['###'], 2.6], [['####'], 2], [['#####'], 1.4],
  [['##', '##'], 3], [['###', '###', '###'], 1], [['###', '###'], 1.8],
  [['#.', '##'], 3], [['#..', '#..', '###'], 1.8], [['#.', '#.', '##'], 3],
  [['###', '.#.'], 2.4], [['##.', '.##'], 2], [['#.', '.#'], 0.8], [['#..', '.#.', '..#'], 0.5]
].map(([rows, w]) => {
  const rots = []; let s = parse(rows);
  for (let i = 0; i < 4; i++) { if (!rots.some(q => q.key === s.key)) rots.push(s); s = rotate(s); }
  return { rots, w, size: rots[0].cells.length };
});

// ---------- state ----------
let W = 0, H = 0, DPR = 1, cell = 40, bx = 0, by = 0, bs = 320, trayY = 0, trayCY = 0, tcell = 22, sw = 100, safeT = 0, safeB = 0;
let grid, pop, tray, score, dispScore, best, streak, since, state = 'menu', endT = 0, newBestShown = false;
let drag = null, preview = null, fitCache = [true, true, true];
let particles = [], dying = [], beams = [], texts = [], shake = 0, flash = 0, flashColor = '#fff', scorePulse = 0;
let now = 0, hue = 255, sprites = [], boardBg = null;
best = +localStorage.nb_best || 0;

function emptyGrid() { return Array.from({ length: N }, () => Array(N).fill(0)); }

// ---------- sprites ----------
function makeSprite(color, size) {
  const pad = Math.ceil(size * 0.3), c = document.createElement('canvas');
  c.width = c.height = Math.ceil((size + pad * 2) * DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  const s = size * 0.9, o = pad + (size - s) / 2, r = s * 0.22;
  g.shadowColor = rgba(color, 0.75); g.shadowBlur = size * 0.35;
  g.fillStyle = color; rr(g, o, o, s, s, r); g.fill(); g.shadowBlur = 0;
  let gr = g.createLinearGradient(0, o, 0, o + s);
  gr.addColorStop(0, shade(color, 0.35)); gr.addColorStop(0.55, color); gr.addColorStop(1, shade(color, -0.4));
  g.fillStyle = gr; rr(g, o, o, s, s, r); g.fill();
  const i = s * 0.13;
  gr = g.createLinearGradient(0, o + i * 0.6, 0, o + s * 0.5);
  gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; rr(g, o + i, o + i * 0.6, s - 2 * i, s * 0.42, r * 0.6); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(o + s * 0.24, o + s * 0.24, s * 0.06, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = Math.max(1, size * 0.035); rr(g, o, o, s, s, r); g.stroke();
  return { c, pad };
}
function buildSprites() {
  sprites = PALETTE.map(col => makeSprite(col, cell));
  sprites.push(makeSprite('#4b4f6e', cell));
  // board background
  const pad = 14, c = document.createElement('canvas');
  c.width = (bs + pad * 2 + 40) * DPR; c.height = (bs + pad * 2 + 40) * DPR;
  const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(20, 20);
  g.shadowColor = 'rgba(155,92,255,.45)'; g.shadowBlur = 30;
  g.fillStyle = 'rgba(14,10,40,.85)'; rr(g, 0, 0, bs + pad * 2, bs + pad * 2, 22); g.fill(); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,255,255,.1)'; g.lineWidth = 1.5; g.stroke();
  for (let r = 0; r < N; r++) for (let q = 0; q < N; q++) {
    const x = pad + q * cell + cell * 0.07, y = pad + r * cell + cell * 0.07;
    g.fillStyle = 'rgba(255,255,255,.05)'; rr(g, x, y, cell * 0.86, cell * 0.86, cell * 0.2); g.fill();
    g.fillStyle = 'rgba(0,0,0,.25)'; rr(g, x + 1, y + cell * 0.5, cell * 0.86 - 2, cell * 0.36, cell * 0.16); g.fill();
  }
  boardBg = { c, off: pad + 20 };
}
function drawSprite(idx, x, y, size, alpha = 1, scale = 1) {
  const sp = sprites[idx]; if (!sp) return;
  const k = size / cell, pad = sp.pad * k, full = size + pad * 2, cx = x + size / 2, cy = y + size / 2;
  const d = full * scale;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(sp.c, cx - d / 2, cy - d / 2, d, d);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

// ---------- layout ----------
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.4, p: Math.random() * 6.28 }));
const orbs = [{ h: 0, x: .2, y: .2, r: .6, sp: .23 }, { h: 60, x: .85, y: .35, r: .55, sp: .17 }, { h: 120, x: .3, y: .85, r: .7, sp: .13 }, { h: 200, x: .8, y: .9, r: .5, sp: .29 }];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  const cs = getComputedStyle(document.getElementById('safe'));
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  const hud = 122, availH = H - safeT - safeB - hud;
  bs = Math.min(W - 36, availH * 0.64, 540);
  cell = Math.floor(bs / N); bs = cell * N;
  bx = Math.round((W - bs) / 2);
  const trayH = Math.min(cell * 3.8, 230);
  const extra = Math.max(0, availH - bs - 24 - trayH);
  by = Math.round(safeT + hud + extra * 0.35);
  trayY = by + bs + 24; trayCY = trayY + trayH / 2;
  sw = Math.min(W, bs + 60) / 3;
  tcell = Math.min(cell * 0.58, (sw - 18) / 5);
  buildSprites();
  if (tray) tray.forEach((p, i) => { if (p) { const [x, y] = slotPos(i); p.tx = p.x = x; p.ty = p.y = y; p.ts = p.s = tcell / cell; } });
}
function slotPos(i) { return [W / 2 + (i - 1) * sw, trayCY]; }

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, soundOn = localStorage.nb_sound !== '0';
function unlockAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
      master = AC.createGain(); master.gain.value = 0.8; master.connect(comp);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state !== 'running') AC.resume();
}
function tone(f, dur, type = 'sine', vol = 0.2, when = 0, slide = null) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1, when = 0) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'bandpass'; fl.Q.value = 1.2;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function sfx(name, a = 0, b = 0) {
  switch (name) {
    case 'pick': tone(880, 0.07, 'triangle', 0.1, 0, 1200); break;
    case 'place': tone(200, 0.14, 'sine', 0.4, 0, 70); tone(520, 0.05, 'triangle', 0.08); noise(0.08, 0.15, 1800, 600); break;
    case 'back': tone(300, 0.1, 'triangle', 0.08, 0, 180); break;
    case 'clear': {
      const base = 392 * Math.pow(2, Math.min(b, 12) / 12), steps = [0, 4, 7, 12, 16, 19, 24];
      for (let i = 0; i < Math.min(steps.length, a + 2); i++) {
        tone(base * Math.pow(2, steps[i] / 12), 0.3, 'triangle', 0.16, i * 0.055);
        tone(base * 2 * Math.pow(2, steps[i] / 12), 0.22, 'sine', 0.06, i * 0.055);
      }
      noise(0.5, 0.25, 400, 6000); tone(90, 0.35, 'sine', 0.45, 0, 40);
      break;
    }
    case 'perfect': [0, 4, 7, 12, 16, 19, 24, 28].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.4, 'square', 0.05, i * 0.06)); break;
    case 'record': [0, 7, 12, 19].forEach((s, i) => tone(659 * Math.pow(2, s / 12), 0.3, 'triangle', 0.12, i * 0.08)); break;
    case 'new': tone(260, 0.18, 'sine', 0.06, 0, 620); break;
    case 'over': [0, -3, -7, -12].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.45, 'sawtooth', 0.05, i * 0.16)); tone(110, 1.2, 'sine', 0.3, 0.2, 40); break;
  }
}

// ---------- game logic ----------
function fits(p, r, c) {
  for (const [dr, dc] of p.cells) { const R = r + dr, C = c + dc; if (R < 0 || C < 0 || R >= N || C >= N || grid[R][C]) return false; }
  return true;
}
function canPlaceAny(p) { for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (fits(p, r, c)) return true; return false; }
function refreshFit() { fitCache = tray.map(p => !p || canPlaceAny(p)); }

function randPiece() {
  const diff = 1 + Math.min(score / 4000, 1.5);
  const ws = BASES.map(b => b.w * (b.size >= 5 ? diff : 1));
  let x = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
  while (x > ws[i]) { x -= ws[i]; i++; }
  const s = BASES[i].rots[rand(BASES[i].rots.length)];
  return { cells: s.cells, w: s.w, h: s.h, color: 0 };
}
function newSet(animate = true) {
  let bestSet = null, bestSc = -1;
  for (let a = 0; a < 50; a++) {
    const set = [randPiece(), randPiece(), randPiece()];
    const fitN = set.filter(canPlaceAny).length;
    if (fitN > bestSc) { bestSc = fitN; bestSet = set; }
    if (fitN === 3 || (fitN >= 1 && a > 6 && Math.random() < 0.3)) break;
  }
  const cols = PALETTE.map((_, i) => i).sort(() => Math.random() - 0.5);
  tray = bestSet.map((p, i) => {
    const [x, y] = slotPos(i);
    p.color = cols[i]; p.tx = x; p.ty = y; p.ts = p.s = tcell / cell;
    p.x = animate ? x + W : x; p.y = y; p.delay = animate ? i * 0.08 : 0;
    return p;
  });
  if (animate) sfx('new');
  refreshFit();
}

function newGame() {
  grid = emptyGrid(); pop = emptyGrid().map(r => r.map(() => -9));
  score = 0; dispScore = 0; streak = 0; since = 0; newBestShown = false;
  particles = []; dying = []; beams = []; texts = [];
  newSet(true); state = 'play'; save();
}

function computeClears(p, r, c) {
  const g = grid.map(row => row.slice());
  for (const [dr, dc] of p.cells) g[r + dr][c + dc] = 1;
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    if (g[i].every(v => v)) rows.push(i);
    let full = true; for (let j = 0; j < N; j++) if (!g[j][i]) { full = false; break; }
    if (full) cols.push(i);
  }
  return { rows, cols };
}

const WORDS = ['', '', 'Отлично!', 'Супер!', 'Невероятно!', 'Безумие!', 'ЛЕГЕНДА!'];
function place(i, r, c) {
  const p = tray[i]; tray[i] = null;
  for (const [dr, dc] of p.cells) { grid[r + dr][c + dc] = p.color + 1; pop[r + dr][c + dc] = now; }
  let pts = p.cells.length;
  const { rows, cols } = computeClears(p, r, c);
  const L = rows.length + cols.length;
  const ar = r + p.h / 2 - 0.5, ac = c + p.w / 2 - 0.5;
  const ax = bx + (ac + 0.5) * cell, ay = by + (ar + 0.5) * cell;
  if (L > 0) {
    streak++; since = 0;
    const set = new Map();
    for (const R of rows) for (let C = 0; C < N; C++) set.set(R * N + C, Math.abs(C - ac) * 0.035);
    for (const C of cols) for (let R = 0; R < N; R++) { const k = R * N + C, d = Math.abs(R - ar) * 0.035; set.set(k, set.has(k) ? Math.min(set.get(k), d) : d); }
    for (const [k, d] of set) {
      const R = (k / N) | 0, C = k % N;
      dying.push({ r: R, c: C, color: grid[R][C] - 1, t: 0, delay: d, spawned: false });
      grid[R][C] = 0;
    }
    rows.forEach(R => beams.push({ row: R, t: 0, color: PALETTE[p.color] }));
    cols.forEach(C => beams.push({ col: C, t: 0, color: PALETTE[p.color] }));
    const linePts = 10 * L * L;
    const gained = linePts * streak;
    pts += gained;
    shake = Math.min(26, 5 + L * 4 + streak * 1.5);
    flash = Math.min(0.5, 0.12 + L * 0.08); flashColor = PALETTE[p.color];
    texts.push({ text: '+' + (gained + p.cells.length), x: Math.max(70, Math.min(W - 70, ax)), y: ay, t: 0, max: 1.1, size: 30 + L * 4, color: '#fff' });
    if (L >= 2) texts.push({ text: WORDS[Math.min(L, 6)], x: bx + bs / 2, y: by + bs * 0.38, t: 0, max: 1.4, size: Math.min(54, W * 0.12), color: PALETTE[(p.color + 2) % PALETTE.length], big: true });
    if (streak >= 2) texts.push({ text: 'КОМБО x' + streak, x: bx + bs / 2, y: by + bs * (L >= 2 ? 0.55 : 0.45), t: 0, max: 1.3, size: Math.min(40, W * 0.09), color: '#ffd23f', big: true });
    sfx('clear', L, streak);
    if (grid.every(row => row.every(v => !v))) {
      pts += 300;
      setTimeout(() => {
        texts.push({ text: 'ИДЕАЛЬНО! +300', x: bx + bs / 2, y: by + bs * 0.7, t: 0, max: 1.8, size: Math.min(42, W * 0.1), color: '#22e39b', big: true });
        sfx('perfect'); confetti(120); flash = 0.5; flashColor = '#22e39b';
      }, 350);
    }
  } else {
    since++; if (since >= 3) streak = 0;
    shake = Math.max(shake, 2.5);
    sfx('place');
  }
  score += pts; scorePulse = 1;
  if (!newBestShown && best > 0 && score > best) {
    newBestShown = true;
    setTimeout(() => { texts.push({ text: 'НОВЫЙ РЕКОРД!', x: W / 2, y: by + bs * 0.2, t: 0, max: 2, size: Math.min(40, W * 0.09), color: '#ffd23f', big: true }); confetti(90); sfx('record'); }, 500);
  }
  if (score > best) { best = score; localStorage.nb_best = best; }
  if (tray.every(q => !q)) newSet(true); else refreshFit();
  save();
  if (!fitCache.some((f, k) => f && tray[k])) gameOver();
}

function gameOver() {
  state = 'ending'; endT = 0; drag = null; preview = null;
  localStorage.removeItem('nb_save');
  setTimeout(() => sfx('over'), 300);
  setTimeout(showGameOver, 1700);
}
function showGameOver() {
  state = 'over';
  const isRec = score >= best && score > 0;
  document.getElementById('ovText').innerHTML = 'Нет места для фигур';
  document.getElementById('ovScore').innerHTML = `Счёт<b>${score}</b>` + (isRec ? '<div class="rec">👑 НОВЫЙ РЕКОРД!</div>' : `<div style="opacity:.7">Рекорд: ${best}</div>`);
  document.getElementById('playBtn').textContent = 'ЕЩЁ РАЗ';
  document.getElementById('overlay').classList.add('show');
  if (isRec) confetti(150);
}

function save() {
  try { localStorage.nb_save = JSON.stringify({ grid, score, streak, since, tray: tray.map(p => p && { cells: p.cells, w: p.w, h: p.h, color: p.color }) }); } catch (e) { }
}
function load() {
  try {
    const s = JSON.parse(localStorage.nb_save || 'null'); if (!s) return false;
    grid = s.grid; score = s.score; dispScore = score; streak = s.streak; since = s.since;
    pop = emptyGrid().map(r => r.map(() => -9));
    tray = s.tray.map((p, i) => { if (!p) return null; const [x, y] = slotPos(i); return Object.assign(p, { x: x + W, y, tx: x, ty: y, s: tcell / cell, ts: tcell / cell, delay: i * 0.08 }); });
    if (tray.every(p => !p)) newSet(false);
    refreshFit(); newBestShown = score >= best;
    return true;
  } catch (e) { return false; }
}

// ---------- effects ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 120 + Math.random() * 420;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180, life: 0.6 + Math.random() * 0.6, max: 1.2, size: cell * (0.12 + Math.random() * 0.2), color, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 18, g: 1 });
  }
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * 6.283, sp = 300 + Math.random() * 500;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35, max: 0.35, size: 3, color: '#fff', spark: true, g: 0.2 });
  }
}
function confetti(n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.3, vx: (Math.random() - 0.5) * 200, vy: 100 + Math.random() * 300, life: 2.5 + Math.random(), max: 3.5, size: 5 + Math.random() * 6, color: PALETTE[rand(PALETTE.length)], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, g: 0.25 });
  }
}

// ---------- input ----------
function pieceTarget(px, py, p, mouse) {
  return [px, py - (mouse ? 0 : p.h * cell / 2 + cell * 1.25)];
}
function updateDrag() {
  const p = tray[drag.i];
  const [cx, cy] = pieceTarget(drag.px, drag.py, p, drag.mouse);
  p.tx = cx; p.ty = cy; p.ts = 1;
  const fx = (cx - p.w * cell / 2 - bx) / cell, fy = (cy - p.h * cell / 2 - by) / cell;
  let bestD = 1e9, br = 0, bc = 0;
  for (const r of [Math.floor(fy), Math.ceil(fy)]) for (const c of [Math.floor(fx), Math.ceil(fx)]) {
    const d = (r - fy) ** 2 + (c - fx) ** 2;
    if (d < bestD && fits(p, r, c)) { bestD = d; br = r; bc = c; }
  }
  if (bestD < 0.8) {
    if (!preview || preview.r !== br || preview.c !== bc) {
      const cl = computeClears(p, br, bc), keys = new Set();
      cl.rows.forEach(R => { for (let C = 0; C < N; C++) keys.add(R * N + C); });
      cl.cols.forEach(C => { for (let R = 0; R < N; R++) keys.add(R * N + C); });
      preview = { r: br, c: bc, keys, p };
    }
  } else preview = null;
}
cv.addEventListener('pointerdown', e => {
  unlockAudio();
  if (state !== 'play' || drag) return;
  const x = e.clientX, y = e.clientY;
  if (y < trayY - cell * 0.6) return;
  const i = Math.floor((x - (W / 2 - 1.5 * sw)) / sw);
  if (i < 0 || i > 2 || !tray[i]) return;
  drag = { i, id: e.pointerId, px: x, py: y, mouse: e.pointerType === 'mouse' };
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  sfx('pick'); updateDrag();
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.px = e.clientX; drag.py = e.clientY; updateDrag();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const i = drag.i, p = tray[i];
  if (preview && e.type === 'pointerup') { const { r, c } = preview; drag = null; preview = null; place(i, r, c); }
  else { const [x, y] = slotPos(i); p.tx = x; p.ty = y; p.ts = tcell / cell; drag = null; preview = null; sfx('back'); }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

document.getElementById('playBtn').addEventListener('click', () => {
  unlockAudio();
  document.getElementById('overlay').classList.remove('show');
  if (state === 'menu' && load()) { state = 'play'; sfx('new'); }
  else newGame();
});
document.getElementById('restartBtn').addEventListener('click', () => {
  unlockAudio();
  if (state === 'play' && confirm('Начать заново?')) { localStorage.removeItem('nb_save'); newGame(); }
});
const soundBtn = document.getElementById('soundBtn');
function syncSound() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
soundBtn.addEventListener('click', () => { unlockAudio(); soundOn = !soundOn; localStorage.nb_sound = soundOn ? '1' : '0'; syncSound(); });
syncSound();
if (localStorage.nb_save) document.getElementById('playBtn').textContent = 'ПРОДОЛЖИТЬ';

// ---------- update ----------
function update(dt) {
  // tray pieces
  if (tray) tray.forEach((p, i) => {
    if (!p) return;
    if (p.delay > 0) { p.delay -= dt; return; }
    const k = 1 - Math.exp(-dt * (drag && drag.i === i ? 32 : 13));
    p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; p.s += (p.ts - p.s) * k;
  });
  for (const d of dying) {
    d.t += dt;
    if (!d.spawned && d.t >= d.delay) { d.spawned = true; burst(bx + (d.c + 0.5) * cell, by + (d.r + 0.5) * cell, PALETTE[d.color], 7); }
  }
  dying = dying.filter(d => d.t - d.delay < 0.4);
  beams.forEach(b => b.t += dt); beams = beams.filter(b => b.t < 0.5);
  for (const p of particles) {
    p.life -= dt; p.vy += 1100 * p.g * dt; p.vx *= (1 - dt * 1.2); p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt;
  }
  particles = particles.filter(p => p.life > 0 && p.y < H + 50);
  if (particles.length > 900) particles.splice(0, particles.length - 900);
  texts.forEach(t => t.t += dt); texts = texts.filter(t => t.t < t.max);
  shake *= Math.exp(-dt * 9); if (shake < 0.2) shake = 0;
  flash = Math.max(0, flash - dt * 1.6);
  scorePulse = Math.max(0, scorePulse - dt * 3);
  if (score !== undefined) dispScore += (score - dispScore) * Math.min(1, dt * 9);
  const th = 255 - Math.min(streak || 0, 8) * 22;
  hue += (th - hue) * Math.min(1, dt * 2);
  if (state === 'ending') endT += dt;
}

// ---------- render ----------
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // background
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},65%,12%)`); g.addColorStop(1, `hsl(${hue + 35},70%,5%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) {
    const x = (o.x + Math.sin(now * o.sp + o.h) * 0.15) * W, y = (o.y + Math.cos(now * o.sp * 0.8 + o.h) * 0.1) * H, r = o.r * Math.max(W, H) * 0.6;
    g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${hue + o.h},90%,55%,${0.16 + (streak > 1 ? 0.06 : 0)})`); g.addColorStop(1, `hsla(${hue + o.h},90%,55%,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.35 * (0.5 + 0.5 * Math.sin(now * 1.5 + s.p))})`; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  ctx.globalCompositeOperation = 'source-over';
  if (!grid) return;

  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // board
  ctx.drawImage(boardBg.c, bx - boardBg.off, by - boardBg.off, boardBg.c.width / DPR, boardBg.c.height / DPR);

  const pv = preview, pulse = 0.5 + 0.5 * Math.sin(now * 14);
  const grayRow = state === 'ending' || state === 'over' ? Math.floor(endT * 9) : -1;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = grid[r][c]; if (!v) continue;
    const x = bx + c * cell, y = by + r * cell;
    let idx = v - 1, sc = 1;
    const t = now - pop[r][c];
    if (t < 0.3) sc = 0.7 + 0.3 * easeOutBack(Math.min(1, t / 0.3));
    if (pv && pv.keys.has(r * N + c)) { idx = pv.p.color; sc = 1 + 0.05 * pulse; }
    if (grayRow >= 0 && N - 1 - r < grayRow) idx = GRAY;
    drawSprite(idx, x, y, cell, 1, sc);
    if (pv && pv.keys.has(r * N + c)) { ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.18 * pulse})`; rr(ctx, x + cell * 0.05, y + cell * 0.05, cell * 0.9, cell * 0.9, cell * 0.2); ctx.fill(); }
  }
  // ghost
  if (pv) {
    for (const [dr, dc] of pv.p.cells) {
      const R = pv.r + dr, C = pv.c + dc, x = bx + C * cell, y = by + R * cell;
      if (pv.keys.has(R * N + C)) drawSprite(pv.p.color, x, y, cell, 0.85 + 0.15 * pulse, 1);
      else drawSprite(pv.p.color, x, y, cell, 0.35, 1);
    }
  }
  // dying cells
  for (const d of dying) {
    const x = bx + d.c * cell, y = by + d.r * cell, k = (d.t - d.delay) / 0.4;
    if (k < 0) { drawSprite(d.color, x, y, cell); continue; }
    const sc = k < 0.25 ? 1 + 0.25 * (k / 0.25) : 1.25 * (1 - (k - 0.25) / 0.75);
    drawSprite(d.color, x, y, cell, 1, Math.max(0, sc));
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 0.9 - k * 1.5)})`;
    const s = cell * 0.9 * Math.max(0, sc);
    rr(ctx, x + (cell - s) / 2, y + (cell - s) / 2, s, s, s * 0.2); ctx.fill();
  }
  // beams
  ctx.globalCompositeOperation = 'lighter';
  for (const b of beams) {
    const k = b.t / 0.5, a = (1 - k) * 0.9, th = cell * (0.6 + 2.2 * k);
    if (b.row !== undefined) {
      const cy = by + (b.row + 0.5) * cell;
      g = ctx.createLinearGradient(0, cy - th / 2, 0, cy + th / 2);
      g.addColorStop(0, rgba(b.color, 0)); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g; ctx.fillRect(bx - cell * k * 2, cy - th / 2, bs + cell * k * 4, th);
    } else {
      const cx = bx + (b.col + 0.5) * cell;
      g = ctx.createLinearGradient(cx - th / 2, 0, cx + th / 2, 0);
      g.addColorStop(0, rgba(b.color, 0)); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g; ctx.fillRect(cx - th / 2, by - cell * k * 2, th, bs + cell * k * 4);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // tray
  if (tray) {
    const order = [0, 1, 2].filter(i => !drag || drag.i !== i); if (drag) order.push(drag.i);
    for (const i of order) {
      const p = tray[i]; if (!p) continue;
      const size = cell * p.s, ok = fitCache[i] && state === 'play';
      const ox = p.x - p.w * size / 2, oy = p.y - p.h * size / 2;
      const lift = drag && drag.i === i;
      for (const [dr, dc] of p.cells) drawSprite(ok ? p.color : GRAY, ox + dc * size, oy + dr * size, size, ok ? 1 : 0.55, lift ? 1.04 : 1);
    }
  }

  // particles
  for (const p of particles) {
    const a = Math.min(1, p.life / p.max * 2);
    ctx.globalAlpha = a;
    if (p.spark) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.35);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // floating texts
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const k = t.t / t.max;
    const sc = k < 0.15 ? easeOutBack(k / 0.15) : 1;
    const a = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.save(); ctx.translate(t.x, t.y - (t.big ? 20 : 60) * k); ctx.scale(sc, sc); ctx.globalAlpha = Math.max(0, a);
    ctx.font = `900 ${t.size}px ui-rounded,-apple-system,system-ui,sans-serif`;
    ctx.lineWidth = t.size * 0.16; ctx.strokeStyle = 'rgba(10,4,30,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(t.text, 0, 0);
    ctx.shadowColor = t.color; ctx.shadowBlur = 20; ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.shadowBlur = 0; ctx.restore();
  }

  // HUD
  const hy = safeT + 14;
  ctx.textAlign = 'left';
  ctx.font = '800 12px ui-rounded,-apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,210,63,.85)';
  ctx.fillText('👑 РЕКОРД', 16, hy + 12);
  ctx.font = '900 20px ui-rounded,-apple-system,system-ui,sans-serif'; ctx.fillStyle = '#ffd23f';
  ctx.fillText(String(best), 16, hy + 34);
  ctx.textAlign = 'center';
  const fs = Math.min(52, W * 0.13) * (1 + scorePulse * 0.15);
  ctx.font = `900 ${fs}px ui-rounded,-apple-system,system-ui,sans-serif`;
  ctx.shadowColor = `hsl(${hue - 60},100%,60%)`; ctx.shadowBlur = 18 + scorePulse * 20; ctx.fillStyle = '#fff';
  ctx.fillText(String(Math.round(dispScore)), W / 2, hy + 50);
  ctx.shadowBlur = 0;
  if (streak >= 1) {
    const cy = hy + 86;
    ctx.font = '900 15px ui-rounded,-apple-system,system-ui,sans-serif';
    const label = '🔥 КОМБО x' + streak, tw = ctx.measureText(label).width + 52;
    ctx.fillStyle = 'rgba(255,210,63,.14)'; rr(ctx, W / 2 - tw / 2, cy - 13, tw, 26, 13); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillText(label, W / 2 - 12, cy + 1);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < 3 - since ? '#ffd23f' : 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(W / 2 + tw / 2 - 30 + i * 8, cy, 2.6, 0, 7); ctx.fill(); }
  }

  if (flash > 0) { ctx.fillStyle = rgba(flashColor.startsWith('#') ? flashColor : '#ffffff', flash * 0.35); ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  update(dt); render(); requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
// show a demo board behind the menu
grid = emptyGrid(); pop = emptyGrid().map(r => r.map(() => -9)); score = 0; dispScore = 0; streak = 0; since = 0;
[[7, 0], [7, 1], [7, 2], [6, 0], [6, 1], [7, 5], [7, 6], [7, 7], [6, 7], [5, 7], [3, 3], [3, 4], [4, 3], [4, 4]].forEach(([r, c], i) => grid[r][c] = (i % PALETTE.length) + 1);
requestAnimationFrame(frame);
</script>
</body>
</html>
