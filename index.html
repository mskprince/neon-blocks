<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Blocks">
<meta name="theme-color" content="#0d0824">
<title>Neon Blocks</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{--b1:#1c0f47;--b2:#0d0726;--b3:#07040f;--c1:rgba(255,61,129,.30);--c2:rgba(47,182,255,.26);--c3:rgba(155,92,255,.32);--c4:rgba(34,227,155,.22)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0824;touch-action:none;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif}
  button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
  canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:1}
  #safe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  /* background */
  #bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);z-index:0}
  #stars{position:absolute;inset:0;width:100%;height:100%}
  .orb{position:absolute;width:110vmax;height:110vmax;border-radius:50%;will-change:transform;transform:translate3d(0,0,0)}
  .o1{left:-55vmax;top:-60vmax;background:radial-gradient(circle,var(--c1),rgba(0,0,0,0) 62%);animation:d1 17s ease-in-out infinite alternate}
  .o2{right:-60vmax;top:-30vmax;background:radial-gradient(circle,var(--c2),rgba(0,0,0,0) 62%);animation:d2 21s ease-in-out infinite alternate}
  .o3{left:-50vmax;bottom:-65vmax;background:radial-gradient(circle,var(--c3),rgba(0,0,0,0) 62%);animation:d3 19s ease-in-out infinite alternate}
  .o4{right:-55vmax;bottom:-60vmax;background:radial-gradient(circle,var(--c4),rgba(0,0,0,0) 62%);animation:d1 23s ease-in-out infinite alternate-reverse}
  #heat{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at 50% 110%,rgba(255,120,40,.5),rgba(255,40,120,.18) 45%,rgba(0,0,0,0) 75%)}
  @keyframes d1{to{transform:translate3d(25vw,18vh,0)}}
  @keyframes d2{to{transform:translate3d(-22vw,22vh,0)}}
  @keyframes d3{to{transform:translate3d(20vw,-20vh,0)}}
  #flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
  /* HUD */
  #hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);z-index:3;pointer-events:none;text-align:center;transition:opacity .3s}
  #bestBox{position:absolute;left:16px;top:2px;text-align:left;color:#ffd23f}
  #bestBox small{display:block;font-size:12px;font-weight:800;opacity:.85}
  #best{font-size:20px;font-weight:900}
  #score{font-size:min(52px,13vw);font-weight:900;line-height:1.1;margin-top:4px;text-shadow:0 0 18px rgba(170,110,255,.9),0 0 4px rgba(255,255,255,.6);display:inline-block}
  #score.pulse{animation:sp .35s ease-out}
  @keyframes sp{30%{transform:scale(1.18)}}
  #combo{margin:2px auto 0;display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:14px;background:rgba(255,210,63,.14);
    color:#ffd23f;font-weight:900;font-size:15px;opacity:0;transition:opacity .25s}
  #combo.on{opacity:1}
  #combo.fever{background:linear-gradient(90deg,#ff3d81,#ff8a00);color:#fff;box-shadow:0 0 18px rgba(255,100,40,.8);animation:fv .5s ease-in-out infinite alternate}
  @keyframes fv{to{transform:scale(1.07)}}
  #combo i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:3px}
  #combo i.off{opacity:.25}
  .hbtn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);height:40px;min-width:40px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.08);font-size:18px;display:flex;align-items:center;justify-content:center;z-index:5;padding:0 10px;font-weight:900}
  .hbtn:active{transform:scale(.92)}
  #pauseBtn{right:14px}
  #gemPill{right:62px;font-size:16px;gap:4px;pointer-events:none}
  #gemPill.bump{animation:bump .3s}
  @keyframes bump{40%{transform:scale(1.25)}}
  #bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:14px;z-index:5;transition:opacity .3s}
  .boost{position:relative;width:64px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);font-size:24px;padding:0}
  .boost:active{transform:scale(.92)}
  .boost b{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:#ff3d81;font-size:12px;line-height:22px;padding:0 5px;box-shadow:0 0 10px rgba(255,61,129,.7)}
  .boost b.buy{background:#2fb6ff;box-shadow:0 0 10px rgba(47,182,255,.7)}
  .boost.active{background:rgba(255,61,129,.35);border-color:#ff3d81;box-shadow:0 0 20px rgba(255,61,129,.7);animation:fv .4s infinite alternate}
  .ingame-hide{opacity:0;pointer-events:none!important}
  .ingame-hide *{pointer-events:none!important}
  /* screens */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,4,24,.84);opacity:0;pointer-events:none;transition:opacity .3s;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px)}
  .screen.show{opacity:1;pointer-events:auto}
  .screen.modal{z-index:20;background:rgba(5,2,16,.7)}
  .panel{width:100%;max-width:400px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(180deg,rgba(40,24,90,.97),rgba(20,12,50,.97));
    border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(155,92,255,.25);
    transform:scale(.88);transition:transform .4s cubic-bezier(.2,1.6,.4,1);text-align:center}
  .screen.show .panel{transform:scale(1)}
  .panel h2{margin:0 0 14px;font-size:26px;font-weight:900}
  .logo{font-size:min(64px,16vw);font-weight:900;line-height:.92;letter-spacing:2px;text-align:center;
    background:linear-gradient(90deg,#ff3d81,#ffb020,#22e39b,#2fb6ff,#9b5cff,#ff3d81);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 4s linear infinite;filter:drop-shadow(0 0 18px rgba(155,92,255,.6))}
  @keyframes hue{to{background-position:300% 0}}
  .topbar{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);font-weight:900;font-size:15px}
  .lvl{flex:1;display:flex;align-items:center;gap:8px}
  .badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9b5cff,#2fb6ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;box-shadow:0 0 14px rgba(155,92,255,.6);flex:none}
  .xpbar{flex:1;max-width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#22e39b,#2fb6ff);border-radius:4px;transition:width .8s}
  .big{margin-top:26px;font-size:24px;font-weight:900;letter-spacing:2px;border:0;border-radius:22px;padding:18px 0;width:min(300px,80vw);
    background:linear-gradient(135deg,#ff3d81,#9b5cff 55%,#2fb6ff);box-shadow:0 0 30px rgba(155,92,255,.7),inset 0 2px 0 rgba(255,255,255,.35);animation:glow 1.6s ease-in-out infinite alternate}
  .big:active{transform:scale(.95)}
  @keyframes glow{to{box-shadow:0 0 50px rgba(255,61,129,.8),inset 0 2px 0 rgba(255,255,255,.35)}}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(300px,80vw);margin-top:16px}
  .tile{position:relative;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);padding:12px 6px;font-weight:800;font-size:14px}
  .tile span{display:block;font-size:28px;margin-bottom:2px}
  .tile:active{transform:scale(.95)}
  .dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ff3d81;box-shadow:0 0 10px #ff3d81;display:none;animation:fv .6s infinite alternate}
  .dot.on{display:block}
  .stats{margin-top:18px;font-size:13px;opacity:.6;line-height:1.6;text-align:center}
  .btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:17px;background:rgba(255,255,255,.12);width:100%;margin-top:10px}
  .btn:active{transform:scale(.96)}
  .btn.pri{background:linear-gradient(135deg,#ff3d81,#9b5cff);box-shadow:0 0 20px rgba(255,61,129,.5)}
  .btn.grn{background:linear-gradient(135deg,#22e39b,#18b0e0);box-shadow:0 0 20px rgba(34,227,155,.45)}
  .btn.gold{background:linear-gradient(135deg,#ffd23f,#ff8a00);color:#2a1500;box-shadow:0 0 20px rgba(255,180,0,.5)}
  .btn:disabled{opacity:.35}
  .row{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);margin-top:10px}
  .row .ic{font-size:28px;width:40px;text-align:center;flex:none}
  .row .tx{flex:1;font-weight:800;font-size:15px}
  .row .tx small{display:block;font-weight:600;opacity:.65;font-size:12px;margin-top:3px}
  .row .btn{width:auto;margin:0;padding:10px 14px;font-size:14px;flex:none}
  .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a00)}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .day{border-radius:14px;padding:10px 2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:11px;font-weight:800}
  .day .r{font-size:14px;margin-top:4px}
  .day.done{opacity:.4}
  .day.today{border-color:#ffd23f;background:rgba(255,210,63,.18);box-shadow:0 0 16px rgba(255,210,63,.4)}
  .day.wide{grid-column:span 2}
  .tabs{display:flex;gap:8px;margin-bottom:6px}
  .tabs button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:900;background:rgba(255,255,255,.07)}
  .tabs button.on{background:rgba(155,92,255,.5)}
  .sw{display:flex;gap:3px;flex:none}
  .sw i{width:14px;height:14px;border-radius:4px;display:block}
  .toggle{width:56px;height:32px;border-radius:16px;background:rgba(255,255,255,.15);position:relative;border:0;padding:0;flex:none}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on{background:#22e39b}
  .toggle.on::after{left:27px}
  .res-score{font-size:68px;font-weight:900;line-height:1.05;text-shadow:0 0 24px rgba(47,182,255,.8)}
  .rec{color:#ffd23f;font-weight:900;font-size:20px;animation:pulse .8s ease-in-out infinite alternate;text-shadow:0 0 16px #ffb020}
  @keyframes pulse{to{transform:scale(1.1)}}
  .rewards{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
  .rewards .chip{font-size:17px}
  .ring{width:96px;height:96px;margin:6px auto 10px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px}
  #toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 72px);z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{padding:10px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(60,30,120,.96),rgba(30,15,70,.96));border:1px solid rgba(255,255,255,.2);
    font-weight:900;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .4s cubic-bezier(.2,1.6,.4,1),tout .4s 2.4s forwards}
  @keyframes tin{from{transform:translateY(30px) scale(.8);opacity:0}}
  @keyframes tout{to{transform:translateY(20px);opacity:0}}
  .hint{font-size:13px;opacity:.6;margin-top:8px}
  input.code{-webkit-user-select:text;user-select:text;flex:1;min-width:0;font:inherit;font-size:16px;font-weight:800;color:#fff;background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;text-transform:uppercase;outline:none}
</style>
</head>
<body>
<div id="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i><canvas id="stars"></canvas><div id="heat"></div></div>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="safe"></div>

<div id="hud" class="ingame-hide"><div id="bestBox"><small>👑 РЕКОРД</small><span id="best">0</span></div><div id="score">0</div><br><div id="combo"></div></div>
<div class="hbtn ingame-hide" id="gemPill">💎 <span id="gemHud">0</span></div>
<button class="hbtn ingame-hide" id="pauseBtn" aria-label="Пауза"><svg width="14" height="16" viewBox="0 0 14 16"><rect x="1" y="1" width="4" height="14" rx="1.5" fill="#fff"/><rect x="9" y="1" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
<div id="bar" class="ingame-hide">
  <button class="boost" id="bHammer">🔨<b id="nHammer">0</b></button>
  <button class="boost" id="bReroll">🔄<b id="nReroll">0</b></button>
</div>
<div id="toasts"></div>

<!-- MAIN MENU -->
<div class="screen show" id="sMenu">
  <div class="topbar">
    <div class="lvl"><div class="badge" id="mLvl">1</div><div class="xpbar"><i id="mXp" style="width:0"></i></div></div>
    <div class="chip">💎 <span id="mGems">0</span></div>
    <div class="chip">❤️ <span id="mRev">0</span></div>
  </div>
  <div class="logo">NEON<br>BLOCKS</div>
  <button class="big" id="playBtn">ИГРАТЬ</button>
  <div class="grid4">
    <button class="tile" id="tDaily"><i class="dot" id="dDaily"></i><span>🎁</span>Награда дня</button>
    <button class="tile" id="tMissions"><i class="dot" id="dMissions"></i><span>🎯</span>Задания</button>
    <button class="tile" id="tShop"><span>🛒</span>Магазин</button>
    <button class="tile" id="tSettings"><span>⚙️</span>Настройки</button>
  </div>
  <div class="stats" id="mStats"></div>
</div>

<!-- generic modal -->
<div class="screen modal" id="sModal"><div class="panel" id="modalBody"></div></div>

<script>
'use strict';
// =====================================================================
//  helpers
// =====================================================================
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const N = 8;
const rand = n => (Math.random() * n) | 0;
function hex2rgb(h) { h = h.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function shade(h, a) { const [r, g, b] = hex2rgb(h); const f = v => Math.round(a > 0 ? v + (255 - v) * a : v * (1 + a)); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const dayDiff = (a, b) => Math.round((new Date(b.replace(/-/g, '/')) - new Date(a.replace(/-/g, '/'))) / 864e5);

// =====================================================================
//  themes
// =====================================================================
const THEMES = {
  neon:  { name: 'Неон',    price: 0,   colors: ['#ff3d81', '#ffb020', '#22e39b', '#2fb6ff', '#9b5cff', '#ff6a3d', '#f2e33a', '#18e0e0'], bg: ['#1c0f47', '#0d0726', '#07040f'], orbs: ['rgba(255,61,129,.30)', 'rgba(47,182,255,.26)', 'rgba(155,92,255,.32)', 'rgba(34,227,155,.22)'] },
  candy: { name: 'Конфета', price: 150, colors: ['#ff8fc7', '#ffc46b', '#7ef0c4', '#8fd3ff', '#c9a4ff', '#ff9f8f', '#fff07a', '#9ff7f0'], bg: ['#3a1546', '#20102e', '#120818'], orbs: ['rgba(255,143,199,.32)', 'rgba(143,211,255,.25)', 'rgba(201,164,255,.3)', 'rgba(255,196,107,.2)'] },
  ocean: { name: 'Океан',   price: 250, colors: ['#00c2ff', '#00e0c6', '#3d7bff', '#7af0ff', '#2fffa8', '#6a6aff', '#a8f0ff', '#00b3b3'], bg: ['#06244a', '#061634', '#030a18'], orbs: ['rgba(0,194,255,.3)', 'rgba(0,224,198,.24)', 'rgba(61,123,255,.3)', 'rgba(47,255,168,.18)'] },
  lava:  { name: 'Лава',    price: 250, colors: ['#ff3b30', '#ff8a00', '#ffd000', '#ff5e7a', '#ff6b00', '#e0245e', '#ffb347', '#ff2d55'], bg: ['#3d0a0a', '#240610', '#100306'], orbs: ['rgba(255,59,48,.32)', 'rgba(255,138,0,.26)', 'rgba(224,36,94,.3)', 'rgba(255,208,0,.18)'] },
  gold:  { name: 'Золото',  price: 500, colors: ['#ffd700', '#f5b700', '#ffe680', '#e6a800', '#fff1a8', '#d4a017', '#ffcc33', '#c9a227'], bg: ['#2a2108', '#16110a', '#0a0805'], orbs: ['rgba(255,215,0,.26)', 'rgba(255,170,0,.2)', 'rgba(255,230,128,.18)', 'rgba(201,162,39,.2)'] },
};
let PALETTE = THEMES.neon.colors;
const GRAY = 8;

// =====================================================================
//  profile (persistent progress)
// =====================================================================
const DEF_PROFILE = { gems: 60, revives: 1, hammers: 1, rerolls: 1, best: 0, xp: 0, level: 1, games: 0, lines: 0, bestCombo: 0,
  theme: 'neon', themes: ['neon'], music: true, sfx: true, daily: { last: '', day: 0 }, missions: { date: '', list: [] } };
let profile;
try { profile = Object.assign({}, DEF_PROFILE, JSON.parse(localStorage.nb_profile || '{}')); } catch (e) { profile = Object.assign({}, DEF_PROFILE); }
if (!localStorage.nb_profile) { profile.best = Math.max(profile.best, +localStorage.nb_best || 0); if (localStorage.nb_sound === '0') profile.sfx = false; localStorage.removeItem('nb_save'); }
function saveProfile() { try { localStorage.nb_profile = JSON.stringify(profile); } catch (e) { } }
const xpNeed = lvl => 800 + 400 * lvl;

// =====================================================================
//  shapes
// =====================================================================
function norm(cells) {
  const mr = Math.min(...cells.map(a => a[0])), mc = Math.min(...cells.map(a => a[1]));
  cells = cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return { cells, w: Math.max(...cells.map(a => a[1])) + 1, h: Math.max(...cells.map(a => a[0])) + 1, key: cells.join(';') };
}
function parse(rows) { const cells = []; rows.forEach((s, r) => [...s].forEach((ch, c) => { if (ch === '#') cells.push([r, c]); })); return norm(cells); }
function rotate(s) { return norm(s.cells.map(([r, c]) => [c, -r])); }
const BASES = [
  [['#'], 1.2], [['##'], 2], [['###'], 2.6], [['####'], 2], [['#####'], 1.4],
  [['##', '##'], 3], [['###', '###', '###'], 1], [['###', '###'], 1.8],
  [['#.', '##'], 3], [['#..', '#..', '###'], 1.8], [['#.', '#.', '##'], 3],
  [['###', '.#.'], 2.4], [['##.', '.##'], 2], [['#.', '.#'], 0.8], [['#..', '.#.', '..#'], 0.5]
].map(([rows, w]) => {
  const rots = []; let s = parse(rows);
  for (let i = 0; i < 4; i++) { if (!rots.some(q => q.key === s.key)) rots.push(s); s = rotate(s); }
  return { rots, w, size: rots[0].cells.length };
});

// =====================================================================

function updateDrag() {
  const p = tray[drag.i];
  const cx = drag.px, cy = drag.py - (drag.mouse ? 0 : p.h * cell / 2 + cell * 1.25);
  p.tx = cx; p.ty = cy; p.ts = 1;
  const fx = (cx - p.w * cell / 2 - bx) / cell, fy = (cy - p.h * cell / 2 - by) / cell;
  let bestD = 1e9, br = 0, bc = 0;
  for (const r of [Math.floor(fy), Math.ceil(fy)]) for (const c of [Math.floor(fx), Math.ceil(fx)]) {
    const d = (r - fy) ** 2 + (c - fx) ** 2;
    if (d < bestD && fits(p, r, c)) { bestD = d; br = r; bc = c; }
  }
  if (bestD < 0.8) {
    if (!preview || preview.r !== br || preview.c !== bc) {
      const cl = computeClears(p, br, bc), keys = new Set();
      cl.rows.forEach(R => { for (let C = 0; C < N; C++) keys.add(R * N + C); });
      cl.cols.forEach(C => { for (let R = 0; R < N; R++) keys.add(R * N + C); });
      preview = { r: br, c: bc, keys, p };
    }
  } else preview = null;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || drag) return;
  const x = e.clientX, y = e.clientY;
  if (hammerMode) {
    const C = Math.floor((x - bx) / cell), R = Math.floor((y - by) / cell);
    if (R >= 0 && C >= 0 && R < N && C < N) useHammerAt(R, C);
    return;
  }
  if (y < trayY - cell * 0.6) return;
  const i = Math.floor((x - (W / 2 - 1.5 * sw)) / sw);
  if (i < 0 || i > 2 || !tray[i]) return;
  drag = { i, id: e.pointerId, px: x, py: y, mouse: e.pointerType === 'mouse' };
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  sfx('pick'); updateDrag();
});
cv.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; drag.px = e.clientX; drag.py = e.clientY; updateDrag(); });
function endDrag(e) {

  else { if (p) { const [x, y] = slotPos(i); p.tx = x; p.ty = y; p.ts = tcell / cell; } drag = null; preview = null; sfx('back'); }
}

function update(dt) {
  if (tray) tray.forEach((p, i) => {
    if (!p) return;
    if (p.delay > 0) { p.delay -= dt; return; }
    const k = 1 - Math.exp(-dt * (drag && drag.i === i ? 32 : 13));
    p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; p.s += (p.ts - p.s) * k;
  });
  for (const d of dying) {
    d.t += dt;
    if (!d.spawned && d.t >= d.delay) { d.spawned = true; burst(bx + (d.c + 0.5) * cell, by + (d.r + 0.5) * cell, PALETTE[colorOf(d.v)], 5); }
  }
  dying = dying.filter(d => d.t - d.delay < 0.4);
  beams.forEach(b => b.t += dt); beams = beams.filter(b => b.t < 0.5);
  for (const p of particles) { p.life -= dt; p.vy += 1100 * p.g * dt; p.vx *= (1 - dt * 1.2); p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt; }
  particles = particles.filter(p => p.life > 0 && p.y < H + 50);
  if (particles.length > 450) particles.splice(0, particles.length - 450);
  texts.forEach(t => t.t += dt); texts = texts.filter(t => t.t < t.max);
  for (const f of flyers) {
    const before = f.t; f.t += dt;
    if (f.t >= f.max && before < f.max) { if (f.type === 'gem') { sfx('gem', rand(4)); bumpGem(); } else sfx('heart'); }
  }
  flyers = flyers.filter(f => f.t < f.max);
  shake *= Math.exp(-dt * 9); if (shake < 0.2) shake = 0;
  scorePulse = Math.max(0, scorePulse - dt * 3);
  dispScore += (score - dispScore) * Math.min(1, dt * 9);
  if (state === 'ending') endT += dt;
}
function bumpGem() { const el = $('gemPill'); $('gemHud').textContent = profile.gems; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function isBusy() {
  if (drag || hammerMode || particles.length || dying.length || beams.length || texts.length || flyers.length || shake || state === 'ending') return true;
  if ((state === 'play' || state === 'stuck') && isFever()) return true;
  if (now - lastPop < 0.4) return true;
  if (tray) for (const p of tray) if (p && (p.delay > 0 || Math.abs(p.tx - p.x) > 0.2 || Math.abs(p.ty - p.y) > 0.2 || Math.abs(p.ts - p.s) > 0.002)) return true;
  return false;
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!grid) return;
  let g;
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(boardBg.c, bx - boardBg.off, by - boardBg.off, boardBg.c.width / DPR, boardBg.c.height / DPR);
  // fever / hammer border
  if (((state === 'play' || state === 'stuck') && isFever()) || hammerMode) {
    const a = 0.55 + 0.45 * Math.sin(now * 10);
    ctx.lineWidth = 4; ctx.strokeStyle = hammerMode ? `rgba(255,61,129,${a})` : `hsla(${(now * 200) % 360},100%,60%,${a})`;
    rr(ctx, bx - 12, by - 12, bs + 24, bs + 24, 20); ctx.stroke();

  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const v = grid[r][c]; if (!v) continue;
    const x = bx + c * cell, y = by + r * cell;
    let sc = 1, oc = null;
    const t = now - pop[r][c];
    if (t < 0.3) sc = 0.7 + 0.3 * easeOutBack(Math.min(1, t / 0.3));
    const inPv = pv && pv.keys.has(r * N + c);
    if (inPv) { oc = pv.p.color; sc = 1 + 0.05 * pulse; }
    if (grayRow >= 0 && N - 1 - r < grayRow) oc = GRAY;

    if (inPv) { ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.18 * pulse})`; rr(ctx, x + cell * 0.05, y + cell * 0.05, cell * 0.9, cell * 0.9, cell * 0.2); ctx.fill(); }
  }

    pv.p.cells.forEach(([dr, dc], k) => {

      drawBlock(v, bx + C * cell, by + R * cell, cell, pv.keys.has(R * N + C) ? 0.85 + 0.15 * pulse : 0.35, 1);
    });
  }
  for (const d of dying) {
    const x = bx + d.c * cell, y = by + d.r * cell, k = (d.t - d.delay) / 0.4;
    if (k < 0) { drawBlock(d.v & 15, x, y, cell); continue; }

    }

      g.addColorStop(0, rgba(b.color, 0)); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g; ctx.fillRect(bx - cell * k * 2, cy - th / 2, bs + cell * k * 4, th);
    } else {
      const cx = bx + (b.col + 0.5) * cell;
      g = ctx.createLinearGradient(cx - th / 2, 0, cx + th / 2, 0);
      g.addColorStop(0, rgba(b.color, 0)); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g; ctx.fillRect(cx - th / 2, by - cell * k * 2, th, bs + cell * k * 4);
    }

    const order = [0, 1, 2].filter(i => !drag || drag.i !== i); if (drag) order.push(drag.i);
    for (const i of order) {
      const p = tray[i]; if (!p) continue;
      const size = cell * p.s, ok = fitCache[i] && (state === 'play' || state === 'paused');
      const ox = p.x - p.w * size / 2, oy = p.y - p.h * size / 2, lift = drag && drag.i === i;
      p.cells.forEach(([dr, dc], k) => drawBlock(ok ? (p.color + 1) | (p.sp[k] << 4) : (GRAY + 1), ox + dc * size, oy + dr * size, size, ok ? 1 : 0.55, lift ? 1.04 : 1));
    }
  }
  // particles

      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();

    if (f.t < 0) continue;
    const k = Math.min(1, f.t / f.max), e = k * k * (3 - 2 * k);
    const x = f.x0 + (f.tx - f.x0) * e, y = f.y0 + (f.ty - f.y0) * e - Math.sin(k * Math.PI) * 80;

  }
}
